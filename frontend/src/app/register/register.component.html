<div class="register-container">
    <h2>Register</h2>
    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email"  
          required 
          class="form-control" 
          placeholder="Enter your email"
        />
      </div>
  
      <div class="form-group">
        <label for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          [(ngModel)]="username"  
          required 
          class="form-control" 
          placeholder="Enter your username"
        />
      </div>
  
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password"  
          required 
          class="form-control" 
          placeholder="Enter your password"
        />
      </div>
  
      <button type="submit" [disabled]="!registerForm.form.valid" class="btn btn-primary">Register</button>
    </form>
  
    <!-- Error message for invalid registration -->
    <div *ngIf="registerError" class="error-message">
      <p>{{ registerError }}</p>
    </div>
  </div>
